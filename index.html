  <!--
    Open Graph / Twitter Card 分享卡片
    站点域名固定为 https://tools.lovou.pw （OG 协议要求绝对地址，
    社交平台不会自动补全相对路径）。若更换域名，请同步修改下方 4 处绝对地址。
  -->
  <link rel="canonical" href="https://tools.lovou.pw/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="集成工具大全">

  <link rel="stylesheet" href="css/style.css">
  <script>
    /* 在样式生效前确定主题，避免刷新时闪白/闪黑 */
    (function () {
      try {
        var saved = localStorage.getItem('toolbox.theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="集成工具大全，返回首页">

        <span class="brand-name">集成工具大全</span>
      </a>

      <div class="header-actions">
        <span class="privacy-pill" title="所有处理均在本地浏览器完成">

            <rect x="4" y="10" width="16" height="11" rx="2.5"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          </svg>
          <span class="privacy-pill-text">本地运行</span>
        </span>

        <button id="themeToggle" class="icon-btn" type="button" aria-label="切换深色 / 浅色主题" title="切换深色 / 浅色主题">

          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.5 1.5M17.3 17.3l1.5 1.5M18.8 5.2l-1.5 1.5M6.7 17.3l-1.5 1.5"/>
          </svg>
        </button>

  <!-- 回到顶部：滚动超过一屏后淡入，点击平滑回顶 -->

      <path d="M12 19V5"/>
      <path d="M5 12l7-7 7 7"/>
    </svg>
  </button>

  <div id="toastRoot" class="toast-root" role="status" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <div class="noscript">本站工具依赖 JavaScript 运行，请在浏览器设置中启用后刷新页面。</div>
  </noscript>

  <!-- 主逻辑（含工具配置表与公共 UI 能力） -->
  <script src="js/main.js"></script>

  <!--
    工具模块（js/tools/*.js）无需在此逐个引入：
    js/main.js 中的 TOOLS 配置里声明了 script 路径，首次进入对应工具时按需加载。
    新增工具只需「新建模块文件 + 在 TOOLS 数组加一条配置」。
  -->

</html>
